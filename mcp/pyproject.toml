[project]
name = "firescope-socal-mcp"
version = "0.1.0"
description = "MCP server for allow-listed Southern California public wildfire APIs"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
firescope-socal-mcp = "firescope_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firescope_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
